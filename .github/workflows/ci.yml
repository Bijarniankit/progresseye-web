name: CI (Web)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify-linux:
    name: Linux Verification (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency Audit (Production)
        run: pnpm audit --prod --audit-level high

      - name: Biome Lint
        run: pnpm lint

      - name: TypeScript Check
        run: pnpm typecheck

      - name: No-Hex Check (Semantic Tokens Enforced)
        run: pnpm test:no-hex

      - name: OpenAPI Contract Drift Check
        run: pnpm test:contract-drift

      - name: Skills Integrity Validation
        run: pnpm test:skills

      - name: Import Case-Sensitivity Verification
        run: pnpm test:case-sensitivity

      - name: Unit Tests
        run: pnpm test

      - name: Next.js Production Build (Linux with official createNextIntlPlugin)
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Inspect Runner Font Metrics & Fallback @font-face
        continue-on-error: true
        run: |
          echo "=== Fontconfig matches on ubuntu-latest ==="
          fc-match Arial || true
          fc-match sans-serif || true
          echo "=== Built fallback @font-face in CSS ==="
          grep -o '@font-face{[^}]*Fallback[^}]*}' .next/static/chunks/*.css || true

      - name: Docker Build Test (Web)
        run: docker build -t progresseye-web:test .

      - name: Axe Accessibility Test Suite
        run: pnpm test:a11y

      - name: Playwright E2E Suite (Production Build)
        run: pnpm test:e2e
        env:
          CI: true

      - name: Lighthouse CI Audit (Non-blocking Report Only)
        continue-on-error: true
        run: |
          pnpm start -p 3000 &
          SERVER_PID=$!
          pnpm exec wait-on -t 30000 http://127.0.0.1:3000
          mkdir -p .lighthouseci
          node -e '
            const { execSync } = require("child_process");
            const fs = require("fs");

            const routes = [
              { path: "/", slug: "home" },
              { path: "/about", slug: "about" },
              { path: "/contact", slug: "contact" },
              { path: "/demo", slug: "demo" },
              { path: "/features", slug: "features" },
            ];

            const results = [];

            for (const r of routes) {
              const runs = [];
              for (let i = 1; i <= 5; i++) {
                const outPath = `.lighthouseci/${r.slug}-run${i}.report`;
                const cmd = `pnpm exec lighthouse http://127.0.0.1:3000${r.path} ` +
                  `--chrome-flags="--headless --no-sandbox --disable-gpu" ` +
                  `--output=json ` +
                  `--output-path=${outPath} ` +
                  `--only-categories=performance ` +
                  `--form-factor=mobile ` +
                  `--screenEmulation.mobile=true ` +
                  `--throttling-method=devtools`;
                try {
                  execSync(cmd, { stdio: "ignore" });
                  const file = fs.existsSync(outPath) ? outPath : (fs.existsSync(`${outPath}.report.json`) ? `${outPath}.report.json` : null);
                  if (file) {
                    const data = JSON.parse(fs.readFileSync(file, "utf8"));
                    runs.push({
                      perf: Math.round((data.categories.performance?.score || 0) * 100),
                      lcp: Math.round(data.audits["largest-contentful-paint"]?.numericValue || 0),
                      tbt: Math.round(data.audits["total-blocking-time"]?.numericValue || 0),
                      cls: parseFloat((data.audits["cumulative-layout-shift"]?.numericValue || 0).toFixed(3)),
                    });
                  }
                } catch (e) {
                  console.error(`Lighthouse failed on ${r.path} run ${i}:`, e.message);
                }
              }

              function median(arr) {
                if (arr.length === 0) return 0;
                const s = [...arr].sort((a, b) => a - b);
                const mid = Math.floor(s.length / 2);
                return s.length % 2 !== 0 ? s[mid] : (s[mid - 1] + s[mid]) / 2;
              }

              const medPerf = median(runs.map((x) => x.perf));
              const medLcp = median(runs.map((x) => x.lcp));
              const medTbt = median(runs.map((x) => x.tbt));
              const medCls = median(runs.map((x) => x.cls));

              const passed = runs.length >= 5 && medLcp <= 2500 && medCls <= 0.01;

              results.push({
                path: r.path,
                runsCount: runs.length,
                perf: medPerf,
                lcp: medLcp,
                tbt: medTbt,
                cls: medCls.toFixed(3),
                status: passed ? "PASS" : "FAIL",
              });

              if (!passed) {
                console.log(
                  `::warning title=Lighthouse Performance Gate Failed for ${r.path}::Runs: ${runs.length}/5, LCP: ${medLcp}ms (limit 2500ms), CLS: ${medCls.toFixed(3)} (limit 0.010)`,
                );
              }
            }

            const table = [
              "## Lighthouse Mobile 5-Run Audits Summary (Medians)",
              "| Route | Runs | Median Perf | Median LCP (ms) | Median TBT (ms) | Median CLS | Status |",
              "|---|---|---|---|---|---|---|",
              ...results.map(
                (r) =>
                  `| ${r.path} | ${r.runsCount} | ${r.perf} | ${r.lcp} | ${r.tbt} | ${r.cls} | ${r.status} |`,
              ),
            ].join("\n");

            console.log(table);
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, table + "\n");
            }
          '
          kill $SERVER_PID || true
        env:
          CI: true

      - name: Upload Lighthouse Reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-ci-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  lead-flow-compose-integration:
    name: Compose Lead Flow Integration (Non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      - name: Checkout progresseye-web
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: progresseye-web

      - name: Checkout progresseye-api
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Bijarniankit/progresseye-api
          path: progresseye-api

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies (API & Web)
        run: |
          cd progresseye-api && pnpm install --frozen-lockfile
          cd ../progresseye-web && pnpm install --frozen-lockfile

      - name: Start Postgres, Redis & Mailpit
        run: |
          cd progresseye-web
          docker compose -f docker-compose.ci.yml up -d postgres redis mailpit

      - name: Wait for Postgres & Apply Database Migrations
        run: |
          cd progresseye-web
          echo "Waiting for postgres to become healthy..."
          docker compose -f docker-compose.ci.yml exec -T postgres sh -c 'until pg_isready -U postgres -d progresseye_test; do sleep 1; done'
          cd ../progresseye-api
          DATABASE_URL="postgresql://postgres:password@localhost:5432/progresseye_test" pnpm exec prisma migrate deploy

      - name: Build and Start Compose Services (API, Worker, Web)
        run: |
          cd progresseye-web
          docker compose -f docker-compose.ci.yml up -d --build api worker web

      - name: Wait for Web & API Healthchecks
        run: |
          cd progresseye-web
          echo "Waiting for web service to be healthy at http://localhost:3000..."
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:3000/ > /dev/null; then
              echo "Web service is healthy!"
              break
            fi
            echo "Waiting for web service (attempt $i/30)..."
            sleep 2
          done

      - name: Install Playwright Chromium
        run: |
          cd progresseye-web
          pnpm exec playwright install --with-deps chromium

      - name: Run Lead Flow Integration Test
        run: |
          cd progresseye-web
          node scripts/test-lead-flow-integration.mjs

      - name: Assert Database Row in public_leads
        run: |
          cd progresseye-web
          echo "=== Asserting PostgreSQL public_leads table content ==="
          docker compose -f docker-compose.ci.yml exec -T postgres psql -U postgres -d progresseye_test -c "SELECT id, email, type, status, created_at, notified_at FROM public_leads;"
          ROW_COUNT=$(docker compose -f docker-compose.ci.yml exec -T postgres psql -U postgres -d progresseye_test -t -A -c "SELECT count(*) FROM public_leads;")
          echo "Found $ROW_COUNT rows in public_leads"
          if [ "$ROW_COUNT" -lt 1 ]; then
            echo "ERROR: Expected at least 1 lead in public_leads table!"
            exit 1
          fi

      - name: Assert Mailpit Message Content
        run: |
          echo "=== Asserting Mailpit notification message ==="
          curl -s http://localhost:8025/api/v1/messages | jq .
          MSG_COUNT=$(curl -s http://localhost:8025/api/v1/messages | jq '.messages | length')
          echo "Found $MSG_COUNT messages in Mailpit"
          if [ "$MSG_COUNT" -lt 1 ]; then
            echo "ERROR: Expected at least 1 message in Mailpit!"
            exit 1
          fi

      - name: Compose Logs on Failure
        if: always()
        run: |
          cd progresseye-web
          docker compose -f docker-compose.ci.yml logs --tail 50

      - name: Tear down Compose Stack
        if: always()
        run: |
          cd progresseye-web
          docker compose -f docker-compose.ci.yml down -v
