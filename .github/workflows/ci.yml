name: CI (Web)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify-linux:
    name: Linux Verification (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency Audit (Production)
        run: pnpm audit --prod --audit-level high

      - name: Biome Lint
        run: pnpm lint

      - name: TypeScript Check
        run: pnpm typecheck

      - name: No-Hex Check (Semantic Tokens Enforced)
        run: pnpm test:no-hex

      - name: OpenAPI Contract Drift Check
        run: pnpm test:contract-drift

      - name: Skills Integrity Validation
        run: pnpm test:skills

      - name: Import Case-Sensitivity Verification
        run: pnpm test:case-sensitivity

      - name: Unit Tests
        run: pnpm test

      - name: Next.js Production Build (Linux with official createNextIntlPlugin)
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Axe Accessibility Test Suite
        run: pnpm test:a11y

      - name: Playwright E2E Suite (Production Build)
        run: pnpm test:e2e
        env:
          CI: true

      - name: Lighthouse CI Audit (Non-blocking Report Only)
        continue-on-error: true
        run: |
          pnpm start -p 3000 &
          SERVER_PID=$!
          pnpm exec wait-on -t 30000 http://127.0.0.1:3000
          mkdir -p .lighthouseci
          pnpm exec lighthouse http://127.0.0.1:3000/ \
            --chrome-flags="--headless --no-sandbox --disable-gpu" \
            --output=json,html \
            --output-path=.lighthouseci/home.report \
            --only-categories=performance,accessibility,best-practices,seo \
            --form-factor=mobile \
            --screenEmulation.mobile=true \
            --throttling-method=devtools
          kill $SERVER_PID || true
          node -e '
            const fs = require("fs");
            const file = ".lighthouseci/home.report.report.json";
            if (!fs.existsSync(file)) {
              console.log("No report generated at", file);
              process.exit(0);
            }
            const r = JSON.parse(fs.readFileSync(file, "utf8"));
            const perf = Math.round((r.categories.performance?.score || 0) * 100);
            const a11y = Math.round((r.categories.accessibility?.score || 0) * 100);
            const bp = Math.round((r.categories["best-practices"]?.score || 0) * 100);
            const seo = Math.round((r.categories.seo?.score || 0) * 100);
            const lcp = Math.round(r.audits["largest-contentful-paint"]?.numericValue || 0);
            const tbt = Math.round(r.audits["total-blocking-time"]?.numericValue || 0);
            const cls = (r.audits["cumulative-layout-shift"]?.numericValue || 0).toFixed(3);
            const passed = lcp <= 2500 && Number(cls) <= 0.01;
            const status = passed ? "PASS" : "FAIL";
            if (!passed) {
              console.log(`::warning title=Lighthouse Performance Gate Failed::LCP: ${lcp}ms, CLS: ${cls} (Thresholds: LCP <= 2500ms, CLS <= 0.010)`);
            }
            const summary = [
              "## Lighthouse Mobile Audit Summary",
              "| Category | Score | Metric | Value |",
              "|---|---|---|---|",
              `| Performance | ${perf} | LCP | ${lcp} ms |`,
              `| Accessibility | ${a11y} | TBT | ${tbt} ms |`,
              `| Best Practices | ${bp} | CLS | ${cls} |`,
              `| SEO | ${seo} | Status | ${status} |`
            ].join("\n");
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + "\n");
            }
            console.log(summary);
          '
        env:
          CI: true

      - name: Upload Lighthouse Reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-ci-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
