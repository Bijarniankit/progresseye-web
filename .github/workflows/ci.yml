name: CI (Web)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify-linux:
    name: Linux Verification (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.11.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency Audit (Production)
        run: pnpm audit --prod --audit-level high

      - name: Biome Lint
        run: pnpm lint

      - name: TypeScript Check
        run: pnpm typecheck

      - name: No-Hex Check (Semantic Tokens Enforced)
        run: pnpm test:no-hex

      - name: OpenAPI Contract Drift Check
        run: pnpm test:contract-drift

      - name: Skills Integrity Validation
        run: pnpm test:skills

      - name: Import Case-Sensitivity Verification
        run: pnpm test:case-sensitivity

      - name: Unit Tests
        run: pnpm test

      - name: Next.js Production Build (Linux with official createNextIntlPlugin)
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Axe Accessibility Test Suite
        run: pnpm test:a11y

      - name: Playwright E2E Suite (Production Build)
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-test-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
