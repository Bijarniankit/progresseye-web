name: CI (Web)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify-linux:
    name: Linux Verification (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency Audit (Production)
        run: pnpm audit --prod --audit-level high

      - name: Biome Lint
        run: pnpm lint

      - name: TypeScript Check
        run: pnpm typecheck

      - name: No-Hex Check (Semantic Tokens Enforced)
        run: pnpm test:no-hex

      - name: OpenAPI Contract Drift Check
        run: pnpm test:contract-drift

      - name: Skills Integrity Validation
        run: pnpm test:skills

      - name: Import Case-Sensitivity Verification
        run: pnpm test:case-sensitivity

      - name: Unit Tests
        run: pnpm test

      - name: Next.js Production Build (Linux with official createNextIntlPlugin)
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Axe Accessibility Test Suite
        run: pnpm test:a11y

      - name: Playwright E2E Suite (Production Build)
        run: pnpm test:e2e
        env:
          CI: true

      - name: Lighthouse CI Audit (Non-blocking Report Only)
        continue-on-error: true
        run: |
          pnpm start -p 3000 &
          SERVER_PID=$!
          npx wait-on http://127.0.0.1:3000
          mkdir -p .lighthouseci
          npx --yes lighthouse http://127.0.0.1:3000/ --chrome-flags="--headless --no-sandbox" --output=json,html --output-path=.lighthouseci/home.report --only-categories=performance,accessibility,best-practices,seo
          kill $SERVER_PID || true
        env:
          CI: true

      - name: Upload Lighthouse Reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-ci-reports
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
